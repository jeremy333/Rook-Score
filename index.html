<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f5130">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rook Score">
<title>Rook Score</title>
<style>
:root{--g:#21522f;--g2:#2f7d46;--cream:#faf7f0;--line:#e6dfd0;--red:#c62828;--ink:#1b1b1b;--mute:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--g);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;color:#fff;padding:8px 4px 14px}
header h1{margin:0;font-size:30px;font-weight:800}
header span{opacity:.85;font-size:17px}
.card{background:var(--cream);border-radius:20px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:12px}
.row>*{flex:1}
.team{background:#fff;border:2px solid var(--line);border-radius:16px;text-align:center;padding:14px 6px}
.team.lead{border-color:var(--g2)}
.team .nm{font-size:20px;font-weight:700;width:100%;border:0;background:transparent;text-align:center;font-family:inherit;color:var(--ink);padding:2px;border-radius:8px}.team .nm:focus{outline:2px solid var(--g2);background:var(--cream)}
.team .sc{font-size:56px;font-weight:800;line-height:1.1}
.team .sc.neg{color:var(--red)}
.meta{text-align:center;color:var(--mute);margin:14px 0 6px;font-size:16px}
.meta input{width:90px;text-align:center;font-size:17px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff}
.lbl{color:var(--mute);margin:16px 0 8px;font-size:16px}
.tog{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:20px;font-weight:700;color:var(--ink)}
.tog.on{background:var(--g);border-color:var(--g);color:#fff}
.num{width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:28px;text-align:center;color:var(--ink)}
.num:focus{outline:none;border-color:var(--g2)}
h2{margin:0 0 4px;font-size:22px}
.add{width:100%;margin-top:22px;background:var(--red);color:#fff;border:0;border-radius:16px;padding:16px;font-size:22px;font-weight:800}
.err{color:var(--red);text-align:center;min-height:20px;margin-top:8px;font-size:15px}
.win{background:#fff;border:2px solid var(--g2);border-radius:14px;text-align:center;padding:12px;font-size:22px;font-weight:800;color:var(--g);margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:16px}
th{color:var(--mute);font-weight:600;padding:6px 4px;text-align:center}
td{padding:8px 4px;text-align:center;border-top:1px solid var(--line)}
td small{display:block;color:var(--mute);font-size:13px}
td.set{color:var(--red);font-weight:700}
.empty{color:var(--mute);text-align:center;padding:8px}
.sm{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:16px;font-weight:600;color:var(--ink)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Rook Score</h1><span id="count">0 hands</span></header>

  <div class="card">
    <div class="row">
      <div class="team" id="box0"><input class="nm" id="nm0" maxlength="20" onchange="rename(0)" onkeydown="if(event.key==='Enter')this.blur()"><div class="sc" id="sc0">0</div></div>
      <div class="team" id="box1"><input class="nm" id="nm1" maxlength="20" onchange="rename(1)" onkeydown="if(event.key==='Enter')this.blur()"><div class="sc" id="sc1">0</div></div>
    </div>
    <div class="meta">Play to <input id="target" type="number" inputmode="numeric" onchange="setTarget()"> · tap a name to rename</div>
    <div class="win" id="win" hidden></div>
    <div class="lbl" style="text-align:center">Points per hand</div>
    <div class="row">
      <button class="tog" id="tot180" onclick="setTotal(180)">180</button>
      <button class="tog" id="tot200" onclick="setTotal(200)">200</button>
    </div>
  </div>

  <div class="card">
    <h2>Add a hand</h2>
    <div class="lbl">Who won the bid?</div>
    <div class="row">
      <button class="tog" id="bid0" onclick="pickBidder(0)">Team 1</button>
      <button class="tog" id="bid1" onclick="pickBidder(1)">Team 2</button>
    </div>
    <div class="lbl">Type of bid</div>
    <div class="row">
      <button class="tog" id="modeReg" onclick="setMoon(false)">Regular</button>
      <button class="tog" id="modeMoon" onclick="setMoon(true)">🌙 Moon</button>
    </div>
    <div class="lbl" id="bidLbl">Bid</div>
    <input class="num" id="bid" type="number" inputmode="numeric" placeholder="e.g. 120">
    <div id="regBox">
      <div class="lbl">Points taken — enter one team, the other fills in</div>
      <div class="row">
        <input class="num" id="pt0" type="number" inputmode="numeric" placeholder="Team 1" oninput="fill(0)">
        <input class="num" id="pt1" type="number" inputmode="numeric" placeholder="Team 2" oninput="fill(1)">
      </div>
    </div>
    <div id="moonBox" hidden>
      <div class="lbl">Did they make the moon?</div>
      <div class="row">
        <button class="tog" id="madeY" onclick="setMade(true)">Made it</button>
        <button class="tog" id="madeN" onclick="setMade(false)">Got set</button>
      </div>
    </div>
    <button class="add" onclick="addHand()">Add hand</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <h2>Hands</h2>
    <table><thead><tr><th>#</th><th>Bid</th><th id="th0">Team 1</th><th id="th1">Team 2</th></tr></thead><tbody id="log"></tbody></table>
    <div class="empty" id="empty">No hands yet</div>
    <div class="row" style="margin-top:14px">
      <button class="sm" onclick="undo()">Undo last hand</button>
      <button class="sm" id="ng" onclick="newGame()">New game</button>
    </div>
  </div>
</div>

<script>
var KEY = 'rookScore.v1';
var S = load() || { names: ['Team 1', 'Team 2'], target: 1000, total: 200, hands: [] };
var bidder = null, moon = false, made = null;

function $(id) { return document.getElementById(id); }
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function rename(i) {
  var n = $('nm' + i).value.trim();
  if (n) S.names[i] = n;
  save(); draw();
}
function setTarget() { var v = parseInt($('target').value, 10); if (v > 0) { S.target = v; save(); } draw(); }
function setTotal(t) { S.total = t; save(); draw(); }
function pickBidder(i) { bidder = i; draw(); }

function fill(i) {
  var v = $('pt' + i).value, o = $('pt' + (1 - i));
  o.value = v === '' ? '' : Math.max(0, S.total - parseInt(v, 10));
}

function setMoon(on) { moon = on; made = null; draw(); }
function setMade(v) { made = v; draw(); }

function addHand() {
  var b = parseInt($('bid').value, 10), p0 = $('pt0').value, p1 = $('pt1').value;
  if (bidder === null) return msg('Tap the team that won the bid.');
  if (!(b > 0)) return msg(moon ? 'Enter the moon score.' : 'Enter the bid.');
  if (moon) {
    if (made === null) return msg('Tap Made it or Got set.');
    var ms = [0, 0]; ms[bidder] = made ? b : -b;
    S.hands.push({ bidder: bidder, bid: b, sc: ms, set: !made, moon: true });
    resetEntry(); save(); draw(); return;
  }
  if (p0 === '' && p1 === '') return msg('Enter points taken for one team.');
  p0 = parseInt(p0, 10); p1 = parseInt(p1, 10);
  if (p0 < 0 || p1 < 0 || p0 + p1 !== S.total) return msg('Points must add up to ' + S.total + '.');
  var pts = [p0, p1], sc = [p0, p1], set = pts[bidder] < b;
  if (set) sc[bidder] = -b;
  S.hands.push({ bidder: bidder, bid: b, sc: sc, set: set });
  resetEntry(); save(); draw();
}
function resetEntry() {
  bidder = null; moon = false; made = null;
  $('bid').value = ''; $('pt0').value = ''; $('pt1').value = ''; msg('');
}
function msg(t) { $('err').textContent = t; }

function undo() { if (S.hands.length) { S.hands.pop(); save(); draw(); } }
var armed = null;
function newGame() {
  var b = $('ng');
  if (!armed) {
    b.textContent = 'Tap again to clear'; b.style.background = 'var(--red)'; b.style.color = '#fff';
    armed = setTimeout(function () { armed = null; b.textContent = 'New game'; b.style.background = ''; b.style.color = ''; }, 3000);
    return;
  }
  clearTimeout(armed); armed = null; b.textContent = 'New game'; b.style.background = ''; b.style.color = '';
  S.hands = []; bidder = null; save(); draw();
}

function draw() {
  var t = [0, 0], rows = '';
  S.hands.forEach(function (h, i) {
    t[0] += h.sc[0]; t[1] += h.sc[1];
    rows += '<tr><td>' + (i + 1) + '</td><td>' + esc(S.names[h.bidder]) + '<small>' + (h.moon ? '🌙 moon ' : 'bid ') + h.bid + '</small></td>';
    for (var k = 0; k < 2; k++)
      rows += '<td' + (h.set && h.bidder === k ? ' class="set"' : '') + '>' + h.sc[k] + '<small>' + t[k] + '</small></td>';
    rows += '</tr>';
  });
  $('log').innerHTML = rows;
  $('empty').hidden = S.hands.length > 0;
  for (var k = 0; k < 2; k++) {
    if (document.activeElement !== $('nm' + k)) $('nm' + k).value = S.names[k];
    $('th' + k).textContent = S.names[k];
    $('bid' + k).textContent = S.names[k];
    $('pt' + k).placeholder = S.names[k];
    $('sc' + k).textContent = t[k];
    $('sc' + k).className = 'sc' + (t[k] < 0 ? ' neg' : '');
    $('box' + k).className = 'team' + (S.hands.length && t[k] > t[1 - k] ? ' lead' : '');
    $('bid' + k).className = 'tog' + (bidder === k ? ' on' : '');
  }
  $('modeReg').className = 'tog' + (!moon ? ' on' : '');
  $('modeMoon').className = 'tog' + (moon ? ' on' : '');
  $('regBox').hidden = moon; $('moonBox').hidden = !moon;
  $('bidLbl').textContent = moon ? 'Moon score (any amount)' : 'Bid';
  $('bid').placeholder = moon ? 'e.g. 400' : 'e.g. 120';
  $('madeY').className = 'tog' + (made === true ? ' on' : '');
  $('madeN').className = 'tog' + (made === false ? ' on' : '');
  $('tot180').className = 'tog' + (S.total === 180 ? ' on' : '');
  $('tot200').className = 'tog' + (S.total === 200 ? ' on' : '');
  $('target').value = S.target;
  $('count').textContent = S.hands.length + (S.hands.length === 1 ? ' hand' : ' hands');

  var w = '', G = S.target;
  if (t[0] >= G || t[1] >= G) {
    var x = (t[0] >= G && t[1] >= G) ? S.hands[S.hands.length - 1].bidder : (t[0] >= G ? 0 : 1);
    w = S.names[x] + ' wins!';
  } else if (t[0] <= -G || t[1] <= -G) {
    w = S.names[t[0] <= -G ? 1 : 0] + ' wins!';
  }
  $('win').textContent = w; $('win').hidden = !w;
}
draw();
</script>
</body>
</html>
